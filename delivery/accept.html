<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Accept delivery — Signature Pianos</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Italianno&amp;family=Jost:wght@300..500&amp;family=Noto+Serif+Display:wdth,wght@62.5,400..500&amp;display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F3F0E9;
      color: #16222E;
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<link rel="stylesheet" href="/css/signature-theme.css" />
<link rel="icon" href="/media/brand/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/media/brand/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/media/brand/apple-touch-icon.png" />
</head>
<body>

<div id="pageContent">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div style="text-align:center;">
      <div style="font-size:20px;color:#16222E;font-style:italic;margin-bottom:16px;">Signature Pianos</div>
      <div style="font-size:13px;color:#3A4855;">Loading…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
/* ============================================================================
   Signature Pianos — driver delivery ACCEPTANCE (public, token based)
   ----------------------------------------------------------------------------
   Driver opens /delivery/accept/{token}. The page lists the customer's
   three preferred windows; the driver picks one. The row update (and
   downstream emails) happen server-side in api/driver-accept.js so the
   anon guard trigger doesn't block the status change.

   The job is loaded with the get_delivery_for_driver RPC
   (supabase/rpc_delivery_links.sql), which matches the token exactly and
   returns only this job's details. The page never reads the deliveries
   table directly.
   ============================================================================ */

const params = new URLSearchParams(window.location.search)
// Also fall back to the last path segment in case the rewrite ever drops
// the query (defensive — the current vercel.json passes ?token=:token).
const token = params.get('token') || window.location.pathname.split('/').pop()
if (!token || token === 'accept') { window.location.replace('/index.html') }

let selectedPrefNum = null

;(async function loadAcceptPage() {
  try {
    const { data: delivery, error } = await _supabase
      .rpc('get_delivery_for_driver', { p_token: token })

    if (error) throw error
    // The RPC also recognises pickup / drop tokens; only an acceptance
    // token opens this page.
    if (!delivery || delivery.kind !== 'accept') return showError('This link is invalid or has expired.')

    if (delivery.driver_accepted) return showAlreadyAccepted(delivery)
    if (!['scheduled', 'pickup_pending'].includes(delivery.status)) {
      return showError('This delivery is already under way. Please contact Signature Pianos if you need help.', 'Link closed')
    }
    renderAcceptPage(delivery)
  } catch (err) {
    console.error('[accept] load failed', err)
    showError('We could not load this assignment. Please try again or contact Signature Pianos.', 'Something went wrong')
  }
})()

function esc(s) {
  if (s == null) return ''
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}
function fmtPref(p) {
  if (!p) return null
  if (typeof p === 'string') return p.trim() || null
  return `${p.date || ''} ${p.time || ''}`.trim() || null
}

function renderAcceptPage(delivery) {
  const piano    = delivery.piano    || {}
  const customer = delivery.customer || {}
  // jsonb -> readable string. Each pref keeps its own number (1/2/3) so
  // the server resolves the one the driver picked, even if one is missing.
  const prefs = [
    { num: 1, text: fmtPref(delivery.customer_preference_1) },
    { num: 2, text: fmtPref(delivery.customer_preference_2) },
    { num: 3, text: fmtPref(delivery.customer_preference_3) },
  ].filter(p => p.text)

  const pianoLabel = [piano.brand, piano.model, piano.year].filter(Boolean).join(' ') || 'Piano'
  const deliverTo = delivery.delivery_address || ''

  document.getElementById('pageContent').innerHTML = `

    <div style="background:#F3F0E9;padding:18px 24px;border-bottom:1px solid rgba(22, 34, 46, 0.12);">
      <div style="font-family:var(--font-script);font-size:30px;line-height:1;color:#16222E;">Signature Pianos</div>
      <div style="font-size:12px;color:#3A4855;margin-top:4px;letter-spacing:0.04em;">Delivery acceptance</div>
    </div>

    <div style="padding:24px;max-width:480px;margin:0 auto;">

      <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 8px;">Accept delivery</h2>
      <p style="font-size:14px;color:#3A4855;margin:0 0 24px;line-height:1.6;">
        Select which delivery window you can do. The customer will be notified of the confirmed date.
      </p>

      <div style="background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;padding:16px;margin-bottom:16px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-bottom:8px;">Piano</div>
        <div style="font-size:18px;font-family:var(--font-display);color:#16222E;font-style:italic;margin-bottom:4px;">${esc(pianoLabel)}</div>
        <div style="font-size:12px;color:#3A4855;">
          ${piano.serial_number ? 'Serial: ' + esc(piano.serial_number) : ''}
          ${piano.weight_kg ? ' · ' + esc(piano.weight_kg) + ' kg' : ' · ~200 kg'}
        </div>
      </div>

      <div style="background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;padding:16px;margin-bottom:16px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-bottom:8px;">Collect from</div>
        <div style="font-size:14px;color:#16222E;font-weight:500;">Signature Pianos Warehouse</div>
        <div style="font-size:13px;color:#3A4855;margin-top:4px;">63 Blackburn Road, Mount Waverley VIC 3149</div>
      </div>

      <div style="background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;padding:16px;margin-bottom:24px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-bottom:8px;">Deliver to</div>
        <div style="font-size:14px;color:#16222E;font-weight:500;">${esc((customer.first_name || '') + ' ' + (customer.last_name || ''))}</div>
        <div style="font-size:13px;color:#3A4855;margin-top:4px;">${esc(deliverTo || '—')}</div>
        ${customer.phone ? `
          <div style="margin-top:8px;">
            <a href="tel:${esc(String(customer.phone).replace(/[^\d+]/g, ''))}" style="font-size:13px;color:#16222E;text-decoration:none;">${esc(customer.phone)}</a>
          </div>
        ` : ''}
        ${delivery.special_instructions ? `
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-top:12px;margin-bottom:4px;">Access notes</div>
          <div style="font-size:13px;color:#3A4855;line-height:1.6;white-space:pre-line;">${esc(delivery.special_instructions)}</div>
        ` : ''}
      </div>

      <div style="margin-bottom:24px;">
        <div style="font-size:14px;font-weight:500;color:#16222E;margin-bottom:12px;">Select which window you can do:</div>
        ${prefs.length === 0 ? `
          <div style="font-size:13px;color:#3A4855;padding:14px;background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;">
            The customer hasn't submitted preferred windows yet. Please contact Signature Pianos.
          </div>
        ` : prefs.map(pref => `
          <label data-pref-num="${pref.num}" onclick="selectPref(${pref.num}, this)"
            style="display:flex;align-items:flex-start;gap:12px;padding:14px;margin-bottom:8px;background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;cursor:pointer;transition:border-color 0.2s;">
            <input type="radio" name="preference" value="${pref.num}" style="margin-top:2px;accent-color:#16222E;flex-shrink:0;">
            <div>
              <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-bottom:3px;">
                ${pref.num === 1 ? "Customer's 1st choice" : pref.num === 2 ? "Customer's 2nd choice" : "Customer's 3rd choice"}
              </div>
              <div style="font-size:14px;color:#16222E;font-weight:500;">${esc(pref.text)}</div>
            </div>
          </label>
        `).join('')}
      </div>

      <div style="margin-bottom:24px;">
        <label style="font-size:12px;color:#3A4855;text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:8px;">Notes for Signature Pianos (optional)</label>
        <textarea id="acceptanceNotes" rows="3"
          placeholder="Any questions or notes about this delivery..."
          style="width:100%;padding:12px;background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;color:#16222E;font-size:14px;resize:vertical;box-sizing:border-box;font-family:var(--font-body);"></textarea>
      </div>

      <button id="acceptBtn" onclick="submitAcceptance('${esc(delivery.delivery_id)}')"
        disabled
        style="width:100%;background:#444;color:#888;border:none;border-radius:4px;padding:18px;font-size:15px;font-weight:500;letter-spacing:0.05em;cursor:not-allowed;transition:all 0.2s ease;font-family:var(--font-body);">
        SELECT A TIME WINDOW ABOVE
      </button>

      <div id="acceptError" style="display:none;margin-top:12px;padding:12px;background:rgba(192,57,43,0.1);border-radius:4px;font-size:13px;color:#e74c3c;text-align:center;"></div>

    </div>
  `
}

function selectPref(num, el) {
  selectedPrefNum = num
  document.querySelectorAll('label[data-pref-num]').forEach(l => {
    l.style.borderColor = 'rgba(22, 34, 46, 0.2)'
  })
  el.style.borderColor = 'rgba(22, 34, 46, 0.8)'
  const radio = el.querySelector('input[type="radio"]')
  if (radio) radio.checked = true

  const btn = document.getElementById('acceptBtn')
  btn.disabled = false
  btn.style.background = '#16222E'
  btn.style.color = '#FFFFFF'
  btn.style.cursor = 'pointer'
  btn.textContent = 'CONFIRM ACCEPTANCE'
}

async function submitAcceptance(deliveryId) {
  if (!selectedPrefNum) return
  const btn     = document.getElementById('acceptBtn')
  const errorEl = document.getElementById('acceptError')
  btn.disabled = true
  btn.textContent = 'CONFIRMING…'
  errorEl.style.display = 'none'

  try {
    const res = await fetch('/api/driver-accept', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token,
        delivery_id:         deliveryId,
        accepted_preference: selectedPrefNum,
        notes:               document.getElementById('acceptanceNotes').value.trim() || null,
      }),
    })
    const result = await res.json().catch(() => ({}))
    if (res.ok && result.success) {
      showAcceptedSuccess(result.confirmed_date, result.pickup_link_sent)
    } else {
      // Server messages (already accepted, date passed…) are written for drivers.
      const e = new Error(result.error || `Request failed (${res.status})`)
      e.fromServer = !!result.error
      throw e
    }
  } catch (err) {
    console.error('[accept] submit failed', err)
    btn.disabled = false
    btn.textContent = 'CONFIRM ACCEPTANCE'
    errorEl.style.display = 'block'
    errorEl.textContent = err.fromServer
      ? err.message
      : 'Something went wrong. Please check your connection and try again.'
  }
}

function showAcceptedSuccess(confirmedDate, pickupLinkSent) {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:64px;margin-bottom:20px;color:#1D9E75;">✓</div>
        <h2 style="font-family:var(--font-display);font-size:30px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">Delivery accepted.</h2>
        <p style="font-size:14px;color:#3A4855;line-height:1.7;margin:0 0 20px;">
          ${confirmedDate ? `Confirmed for ${esc(confirmedDate)}.` : 'Delivery confirmed.'} The customer has been notified.
        </p>
        <div style="background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;padding:16px;font-size:13px;color:#3A4855;text-align:left;line-height:1.8;">
          ${pickupLinkSent
            ? 'The pickup is coming up soon, so your pickup photo link has been emailed to you now.<br><br>You will also get a reminder on the day.'
            : 'Your pickup photo link will be emailed to you in the 3 days before the confirmed date.<br><br>You will also get a reminder on the day.'}
        </div>
      </div>
    </div>
  `
}

function showAlreadyAccepted() {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:48px;margin-bottom:16px;color:#1D9E75;">✓</div>
        <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">Already accepted</h2>
        <p style="font-size:13px;color:#3A4855;line-height:1.7;">You have already accepted this delivery. Check your email for your reminder and pickup link.</p>
      </div>
    </div>
  `
}

function showError(message, title = 'Link not found') {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:48px;margin-bottom:16px;color:#16222E;">✗</div>
        <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">${esc(title)}</h2>
        <p style="font-size:13px;color:#3A4855;line-height:1.7;">${esc(message)}</p>
      </div>
    </div>
  `
}
</script>

</body>
</html>
