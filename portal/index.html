<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — Signature Pianos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Italianno&amp;family=Jost:wght@300..500&amp;family=Noto+Serif+Display:wdth,wght@62.5,400..500&amp;display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F3F0E9;
    color: #16222E;
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: #E9E5DB;
    border: 1px solid rgba(22, 34, 46, 0.2);
    border-radius: 4px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
  }
  .logo {
    font-family: var(--font-display);
    font-size: 24px;
    color: #16222E;
    font-style: italic;
    text-align: center;
    margin-bottom: 8px;
  }
  .tagline {
    font-size: 12px;
    color: #3A4855;
    text-align: center;
    margin-bottom: 32px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  label {
    font-size: 12px;
    color: #3A4855;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px;
    background: #F3F0E9;
    border: 1px solid rgba(22, 34, 46, 0.2);
    border-radius: 4px;
    color: #16222E;
    font-size: 14px;
    font-family: var(--font-body);
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: rgba(22, 34, 46, 0.5); }
  .btn {
    width: 100%;
    background: #16222E;
    color:#FFFFFF;
    border: none;
    border-radius: 4px;
    padding: 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font-body);
    letter-spacing: 0.05em;
  }
  .btn:disabled { opacity: 0.6; cursor: progress; }
  .error {
    background: rgba(192,57,43,0.1);
    border: 1px solid rgba(192,57,43,0.3);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 12px;
    color: #e74c3c;
    margin-bottom: 16px;
    display: none;
  }
  .hint {
    font-size: 12px;
    color: #3A4855;
    text-align: center;
    margin-top: 16px;
    line-height: 1.6;
  }
</style>
<link rel="stylesheet" href="/css/signature-theme.css" />
<link rel="icon" href="/media/brand/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/media/brand/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/media/brand/apple-touch-icon.png" />
</head>
<body>

<div class="login-card">
  <div class="logo">Signature Pianos</div>
  <div class="tagline">My Account</div>

  <div id="loginView">
    <label for="loginEmail">Email address</label>
    <input type="email" id="loginEmail"
      placeholder="your@email.com" autocomplete="email" inputmode="email"
      onkeydown="if(event.key==='Enter')sendMagicLink()">

    <div class="error" id="loginError"></div>

    <button class="btn" onclick="sendMagicLink()" id="loginBtn">
      SEND LOGIN LINK
    </button>

    <p class="hint">We'll send a secure login link to your email.<br>No password needed.</p>
  </div>

  <div id="sentView" style="display:none;text-align:center;">
    <div style="font-size:48px;margin-bottom:16px;">📧</div>
    <h2 style="font-family:var(--font-display);font-size:24px;font-weight:300;font-style:italic;margin-bottom:12px;">
      Check your email
    </h2>
    <p style="font-size:13px;color:#3A4855;line-height:1.7;">
      We sent a login link to<br>
      <strong id="sentEmail" style="color:#16222E;"></strong>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
function showLoginError(msg) {
  const errorEl = document.getElementById('loginError')
  errorEl.textContent = msg
  errorEl.style.display = msg ? 'block' : 'none'
}

// Already signed in: straight to the account. Back from an expired link: say so.
;(async function init() {
  if (new URLSearchParams(location.search).get('link') === 'expired') {
    showLoginError('That login link has expired or was already used. Enter your email and we’ll send a new one.')
  }
  try {
    const { data: { session } } = await _supabase.auth.getSession()
    if (session) window.location.replace('/portal/dashboard')
  } catch (e) { /* stay on the sign-in form */ }
})()

// The link in the email lands on the dashboard. The redirect target must be on
// the Supabase Auth allow-list (Studio → Authentication → URL Configuration):
// https://signaturepianos.com.au/portal/dashboard (plus the local / preview
// origin + /portal/dashboard if you sign in there; anything not on the list
// falls back to the Site URL).
function portalRedirectUrl() {
  return /(^|\.)signaturepianos\.com\.au$/.test(location.hostname)
    ? 'https://signaturepianos.com.au/portal/dashboard'
    : location.origin + '/portal/dashboard'
}

async function sendMagicLink() {
  const email = document.getElementById('loginEmail').value.trim()
  const btn = document.getElementById('loginBtn')
  if (btn.disabled) return

  if (!email) return showLoginError('Please enter your email address.')
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return showLoginError('Please check your email address.')

  btn.textContent = 'SENDING…'
  btn.disabled = true
  showLoginError('')

  let error = null
  try {
    ;({ error } = await _supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: portalRedirectUrl() },
    }))
  } catch (err) {
    error = err
  }

  if (error) {
    console.error('[portal] magic link failed', error)
    // Never echo the server's message: the same wording for everyone, so the
    // page doesn't say whether an email address has an account.
    const tooSoon = error.status === 429 || /rate limit|security purposes|seconds/i.test(error.message || '')
    showLoginError(tooSoon
      ? 'A login link was sent recently. Please check your inbox, or wait a minute and try again.'
      : 'We couldn’t send the link just now. Please try again, or call us on 0479 128 955.')
    btn.textContent = 'SEND LOGIN LINK'
    btn.disabled = false
    return
  }

  document.getElementById('loginView').style.display = 'none'
  document.getElementById('sentView').style.display = 'block'
  document.getElementById('sentEmail').textContent = email
}
</script>

</body>
</html>
