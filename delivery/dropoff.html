<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
/* ============================================================================
   Signature Pianos — driver DROPOFF photo flow (public, token based)
   ----------------------------------------------------------------------------
   Sibling of pickup.html. Differences:
     * Loads via the delivery token (get_delivery_for_driver RPC, kind 'drop';
       see supabase/rpc_delivery_links.sql)
     * Already-confirmed check short-circuits on 'delivered'; a reported
       damage closes the link until admin reopens it
     * Photos uploaded under {deliveryId}/delivery/{ts}-{n}.jpg
     * POSTs to /api/driver-delivery-confirm (which generates warranty
       + auto-books tuner under service role)
     * Final state mentions warranty + tuner booking
   ============================================================================ */

// Vercel server rewrites do not expose the destination's query params to
// the browser (window.location.search stays empty for /delivery/drop/{token}),
// so the path segment is the reliable source. Fall back to ?token= in case
// the page is ever opened directly with the token as a query string.
const params = new URLSearchParams(window.location.search)
const token  = params.get('token') || window.location.pathname.split('/').pop()
if (!token || token === 'dropoff.html' || token === 'drop') {
  window.location.replace('/index.html')
}

let currentDelivery = null
// { file, dataUrl, url } — url is set once the photo is uploaded, so a
// retry after a failed confirm doesn't upload it again.
let selectedPhotos = []
const MAX_PHOTOS = 10
let deliveryStatusType = 'no_issues'

window.setDeliveryStatus = function (type) {
  deliveryStatusType = type
  const issueDetails = document.getElementById('issueDetails')
  const issueLabel   = document.getElementById('issueTypeLabel')
  if (!issueDetails || !issueLabel) return
  if (type === 'no_issues') {
    issueDetails.style.display = 'none'
  } else {
    issueDetails.style.display = 'block'
    issueLabel.textContent = type === 'damage'
      ? '⚠ Damage report — Eric will be notified immediately'
      : '✗ Failed delivery — Eric will be notified immediately'
  }
}

;(async function loadDeliveryPage() {
  try {
    const { data: delivery, error } = await _supabase
      .rpc('get_delivery_for_driver', { p_token: token })

    if (error) throw error
    // Only a delivery (drop) token opens this page.
    if (!delivery || delivery.kind !== 'drop') return showError('This link is invalid or has expired.')

    if (delivery.status === 'delivered') {
      return showAlreadyConfirmed()
    }
    if (delivery.status === 'damage_reported') {
      return showError('Damage has already been reported for this delivery. Please call Signature Pianos.', 'Damage reported')
    }
    currentDelivery = delivery
    renderDeliveryPage(delivery)
  } catch (err) {
    console.error('[dropoff] load failed', err)
    showError('We could not load this delivery. Please try again or contact Signature Pianos.', 'Something went wrong')
  }
})()

function esc(s) {
  if (s == null) return ''
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

function renderDeliveryPage(delivery) {

  const customer = delivery.customer || {}
  const pianoLabel = [piano.brand, piano.model, piano.year].filter(Boolean).join(' ') || 'Piano'
  const customerName = [customer.first_name, customer.last_name].filter(Boolean).join(' ')

  const deliverTo = [customerName, delivery.delivery_address].filter(Boolean).join(', ')

  document.getElementById('pageContent').innerHTML = `

    <div style="background:#F3F0E9;padding:18px 24px;position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(22, 34, 46, 0.12);">
      <div style="font-family:var(--font-script);font-size:30px;line-height:1;color:#16222E;">Signature Pianos</div>
      <div style="font-size:12px;color:#3A4855;margin-top:4px;letter-spacing:0.04em;">Piano delivery — photo confirmation</div>
    </div>

    <div style="padding:24px;max-width:480px;margin:0 auto;">

      <div style="background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;padding:16px;margin-bottom:24px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-bottom:8px;">Piano being delivered</div>
        <div style="font-size:20px;font-family:var(--font-display);color:#16222E;font-style:italic;margin-bottom:4px;">${esc(pianoLabel)}</div>
        <div style="font-size:12px;color:#3A4855;">
          ${piano.serial_number ? 'Serial: ' + esc(piano.serial_number) : ''}
        </div>
        ${deliverTo ? `
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-top:14px;margin-bottom:4px;">Deliver to</div>
          <div style="font-size:13px;color:#3A4855;line-height:1.6;">${esc(deliverTo)}</div>
        ` : ''}
        ${customer.phone ? `
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-top:10px;margin-bottom:4px;">Customer phone</div>
          <a href="tel:${esc(String(customer.phone).replace(/[^\d+]/g, ''))}" style="font-size:13px;color:#16222E;text-decoration:none;">${esc(customer.phone)}</a>
        ` : ''}
        ${delivery.special_instructions ? `
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-top:10px;margin-bottom:4px;">Access notes</div>
          <div style="font-size:13px;color:#3A4855;line-height:1.6;white-space:pre-line;">${esc(delivery.special_instructions)}</div>
        ` : ''}
      </div>

      <div style="margin-bottom:24px;">
        <div style="font-size:14px;font-weight:500;color:#16222E;margin-bottom:12px;">Once the piano is in place:</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${[
            'Place the piano in the agreed position',
            'Photograph the piano in its new home — all 4 sides',
            'Photograph it in context of the room',
            'Take at least 3 photos minimum',
            'Upload photos using the button below',
          ].map((step, i) => `
            <div style="display:flex;gap:12px;align-items:flex-start;">
              <div style="background:#16222E;color:#FFFFFF;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;margin-top:1px;">${i + 1}</div>

      <div style="background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.3);border-radius:4px;padding:14px;margin-bottom:24px;">

      </div>

      <div style="margin-bottom:20px;">
        <div style="font-size:14px;font-weight:500;color:#16222E;margin-bottom:12px;">Delivery status</div>
        <div style="display:flex;flex-direction:column;gap:8px;">

      <div id="issueDetails" style="display:none;margin-bottom:20px;">

      <div style="margin-bottom:24px;">

        </div>

        <input type="file" id="photoInput"
          accept="image/*" multiple capture="environment"

          placeholder="Anything to record about the placement or condition..."
          style="width:100%;padding:12px;background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;color:#16222E;font-size:14px;resize:vertical;box-sizing:border-box;font-family:var(--font-body);"></textarea>
      </div>

      <button id="submitBtn" onclick="submitDeliveryPhotos()" disabled
        style="width:100%;background:#444;color:#888;border:none;border-radius:4px;padding:18px;font-size:15px;font-weight:500;letter-spacing:0.05em;cursor:not-allowed;transition:all 0.2s ease;font-family:var(--font-body);">
        ADD AT LEAST 3 PHOTOS TO CONTINUE
      </button>

      <div id="submitError" style="display:none;margin-top:12px;padding:12px;background:rgba(192,57,43,0.1);border-radius:4px;font-size:13px;color:#e74c3c;text-align:center;"></div>

    </div>
  `
}

function handlePhotoSelect(e) {
  const files = Array.from(e.target.files || [])
  e.target.value = ''
  if (!files.length) return
  // Each photo takes its slot straight away (the preview fills in when the
  // file has been read), so the cap holds when many files are picked at once.
  files.forEach(file => {
    if (!file.type.startsWith('image/')) return
    if (selectedPhotos.length >= MAX_PHOTOS) return
    const photo = { file, dataUrl: null, url: null }
    selectedPhotos.push(photo)
    const reader = new FileReader()
    reader.onload = (ev) => {
      photo.dataUrl = ev.target.result
      renderPhotoPreview()
    }
    reader.readAsDataURL(file)
  })
  renderPhotoPreview()
}

function renderPhotoPreview() {
  const preview = document.getElementById('photoPreview')
  const count   = document.getElementById('photoCount')
  const btn     = document.getElementById('submitBtn')

  preview.innerHTML = selectedPhotos.map((photo, i) => `
    <div style="position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:#E9E5DB;">
      ${photo.dataUrl ? `<img src="${photo.dataUrl}" style="width:100%;height:100%;object-fit:cover;">` : ''}
      <button onclick="removePhoto(${i})"
        style="position:absolute;top:4px;right:4px;background:rgba(22, 34, 46, 0.28);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">×</button>
    </div>
  `).join('')

  const n = selectedPhotos.length
  count.textContent = `${n} photo${n !== 1 ? 's' : ''} selected${n >= MAX_PHOTOS ? ' (maximum)' : ''}`
  count.style.color = n >= 3 ? '#1D9E75' : '#3A4855'

  if (n >= 3) {
    btn.disabled = false
    btn.style.background = '#16222E'
    btn.style.color = '#FFFFFF'
    btn.style.cursor = 'pointer'
    btn.textContent = `CONFIRM DELIVERY — ${n} PHOTO${n !== 1 ? 'S' : ''}`
  } else {
    btn.disabled = true
    btn.style.background = '#444'
    btn.style.color = '#888'
    btn.style.cursor = 'not-allowed'
    btn.textContent = 'ADD AT LEAST 3 PHOTOS TO CONTINUE'
  }
}

function removePhoto(i) {
  selectedPhotos.splice(i, 1)
  renderPhotoPreview()
}

async function submitDeliveryPhotos() {
  if (selectedPhotos.length < 3) return
  const btn     = document.getElementById('submitBtn')
  const errorEl = document.getElementById('submitError')
  errorEl.style.display = 'none'

  // Session 13 adds delivery_status + issue_description so the API can
  // branch on damage / failed-delivery and skip the warranty + tuner
  // booking chain when something went wrong. Checked before any upload.
  const issueDescription = document.getElementById('issueDescription')?.value?.trim() || null
  if (deliveryStatusType !== 'no_issues' && !issueDescription) {
    errorEl.style.display = 'block'
    errorEl.textContent = 'Please describe what happened before submitting.'
    document.getElementById('issueDescription')?.focus()
    return
  }

  btn.disabled = true
  try {
    const uploadedUrls = []
    const deliveryId = currentDelivery.delivery_id

    // Photos already uploaded on an earlier try keep their URL and are
    // not uploaded again.
    for (let i = 0; i < selectedPhotos.length; i++) {
      btn.textContent = `UPLOADING ${i + 1} OF ${selectedPhotos.length}…`
      try {
        uploadedUrls.push(await uploadPhoto(selectedPhotos[i], i, deliveryId, 'delivery'))
      } catch (upErr) {
        upErr.userMessage = `Photo ${i + 1} didn't upload (${upErr.message || 'network error'}). Check your connection and tap Try again; photos already uploaded won't be sent twice.`
        throw upErr
      }
    }

    btn.textContent = 'CONFIRMING DELIVERY…'
    let res
    try {
      res = await fetch('/api/driver-delivery-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token,
          photo_urls:        uploadedUrls,
          notes:             document.getElementById('deliveryNotes').value.trim() || null,
          delivery_status:   deliveryStatusType,
          issue_description: issueDescription,
        }),
      })
    } catch (netErr) {
      netErr.userMessage = 'Your photos are uploaded, but we couldn\'t reach Signature Pianos to confirm. Check your connection and tap Try again.'
      throw netErr
    }
    const result = await res.json().catch(() => ({}))
    if (!res.ok || !result.success) {
      console.error('[dropoff] confirm API failed', result)
      const apiErr = new Error(result.error || `Confirm failed (${res.status})`)
      apiErr.userMessage = result.error || `Something went wrong confirming the delivery (error ${res.status}). Tap Try again, or call Signature Pianos.`
      throw apiErr
    }

    showDeliverySuccess(uploadedUrls.length, deliveryStatusType, result)
  } catch (err) {
    console.error('[dropoff] submit failed', err)
    btn.disabled = false
    btn.textContent = 'TRY AGAIN'
    btn.style.background = '#c0392b'
    btn.style.color = '#fff'
    errorEl.style.display = 'block'
    errorEl.textContent = err.userMessage || 'Upload failed — please check your connection and try again.'
  }
}

/* Upload one photo (once) to delivery-photos/{deliveryId}/{leg}/ and return its public URL. */
async function uploadPhoto(photo, i, deliveryId, leg) {
  if (photo.url) return photo.url
  const types = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/heic': 'heic', 'image/heif': 'heif', 'image/gif': 'gif' }
  const type = types[photo.file.type] ? photo.file.type : 'image/jpeg'
  const filename = `${deliveryId}/${leg}/${Date.now()}-${i + 1}.${types[type]}`
  const { error: upErr } = await _supabase.storage
    .from('delivery-photos')
    .upload(filename, photo.file, { contentType: type, upsert: false })
  if (upErr) throw upErr
  const { data: urlData } = _supabase.storage
    .from('delivery-photos')
    .getPublicUrl(filename)
  photo.url = urlData.publicUrl
  return photo.url
}

function showDeliverySuccess(count, status, result = {}) {
  // Built from what the server actually did (warranty issued? tuning booked?
  // Eric's email sent?), not from what was meant to happen.
  const call = 'call Eric now on <a href="tel:+61479128955" style="color:inherit;">0479 128 955</a>'
  const notified = result.notified !== false
  const years = result.warranty_years
  const tuning = {
    booked:       'First tuning booked (~25 days)',
    existing:     'First tuning already booked',
    failed:       'First tuning: Signature Pianos will book it',
    not_required: null,
  }[result.tuner_booking]
  const messages = {
    no_issues: {
      icon: '✓', color: '#1D9E75',
      title: 'Delivery confirmed.',
      body: `${count} photos uploaded successfully.${result.customer_notified !== false ? ' The customer has been notified their piano has arrived.' : ''}${result.warranty_number ? ' Their warranty has been issued automatically.' : ''}`,
      checklist: [
        'Photos saved to Signature Pianos',
        result.customer_notified !== false ? 'Customer notified — piano has arrived' : 'Signature Pianos will contact the customer',
        result.warranty_number ? `${years || 10}-year warranty issued` : null,
        tuning,
      ].filter(Boolean),
      checklistColor: '#1D9E75',
    },
    damage: {
      icon: '⚠', color: '#e74c3c',
      title: 'Damage report submitted.',
      body: notified
        ? 'Eric has been notified immediately. Do not leave until you have spoken with Eric.'
        : `The report is saved, but the alert email to Eric didn't send. Please ${call}, and do not leave until you have spoken with him.`,
      checklist: [
        `Photos saved (${count})`,
        'Damage notes logged',
        notified ? 'Eric notified urgently' : 'Eric NOT yet notified — call him',
        'Warranty + tuner booking paused until resolved',
      ],
      checklistColor: '#e74c3c',
    },
    failed: {
      icon: '✗', color: '#e74c3c',
      title: 'Failed delivery logged.',
      body: notified
        ? 'Eric has been notified. Please contact Eric directly to arrange redelivery.'
        : `The reason is saved, but the email to Eric didn't send. Please ${call} to arrange redelivery.`,
      checklist: [
        `Photos saved (${count})`,
        'Reason logged',
        notified ? 'Eric notified — will contact customer' : 'Eric NOT yet notified — call him',
        'Warranty + tuner booking paused until redelivery',
      ],
      checklistColor: '#e74c3c',
    },
  }
  const m = messages[status] || messages.no_issues
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:72px;margin-bottom:24px;color:${m.color};">${m.icon}</div>
        <h2 style="font-family:var(--font-display);font-size:32px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 16px;">${m.title}</h2>
        <p style="font-size:14px;color:#3A4855;line-height:1.7;margin:0 0 24px;">${m.body}</p>
        <div style="background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;padding:16px;font-size:13px;color:#3A4855;text-align:left;">
          ${m.checklist.map((line, i) => `<div style="margin-bottom:${i === m.checklist.length - 1 ? '0' : '6px'};">${m.icon === '✓' ? '✓' : '•'} ${esc(line)}</div>`).join('')}
        </div>
      </div>
    </div>
  `
}

function showAlreadyConfirmed() {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:48px;margin-bottom:16px;color:#1D9E75;">✓</div>
        <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">Delivery already confirmed</h2>
        <p style="font-size:13px;color:#3A4855;line-height:1.7;">This has already been submitted. Contact Signature Pianos if you need help.</p>
      </div>
    </div>
  `
}

function showError(message, title = 'Link not found') {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:48px;margin-bottom:16px;color:#16222E;">✗</div>
        <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">${esc(title)}</h2>
        <p style="font-size:13px;color:#3A4855;line-height:1.7;">${esc(message)}</p>
      </div>
    </div>
  `
}
</script>
