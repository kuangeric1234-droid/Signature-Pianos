<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Piano Pickup — Signature Pianos</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Italianno&amp;family=Jost:wght@300..500&amp;family=Noto+Serif+Display:wdth,wght@62.5,400..500&amp;display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F3F0E9;
      color: #16222E;
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<link rel="stylesheet" href="/css/signature-theme.css" />
<link rel="icon" href="/media/brand/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/media/brand/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/media/brand/apple-touch-icon.png" />
</head>
<body>

<div id="pageContent">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div style="text-align:center;">
      <div style="font-size:20px;color:#16222E;font-style:italic;margin-bottom:16px;">Signature Pianos</div>
      <div style="font-size:13px;color:#3A4855;">Loading…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
/* ============================================================================
   Signature Pianos — driver pickup photo flow (public, token based)
   ----------------------------------------------------------------------------
   Loads the job with the get_delivery_for_driver RPC (exact match on the
   pickup token; see supabase/rpc_delivery_links.sql), has the driver
   upload >=3 photos directly to the delivery-photos bucket, then POSTs
   the photo URLs + notes to /api/driver-pickup-confirm which does the row
   update + customer email + Eric notification under service role. Token
   verification happens server-side inside the API.
   ============================================================================ */

// Vercel server rewrites do not expose the destination's query params to
// the browser (window.location.search stays empty for /delivery/{token}),
// so the path segment is the reliable source. Fall back to ?token= in case
// the page is ever opened directly with the token as a query string.
const params = new URLSearchParams(window.location.search)
const token  = params.get('token') || window.location.pathname.split('/').pop()
if (!token || token === 'pickup.html' || token === 'delivery') {
  window.location.replace('/index.html')
}

let currentDelivery = null
// { file, dataUrl, url } — url is set once the photo is uploaded, so a
// retry after a failed confirm doesn't upload it again.
let selectedPhotos = []
const MAX_PHOTOS = 10

;(async function loadPickupPage() {
  try {
    const { data: delivery, error } = await _supabase
      .rpc('get_delivery_for_driver', { p_token: token })

    if (error) throw error
    // Only a pickup token opens this page (the RPC also knows accept/drop tokens).
    if (!delivery || delivery.kind !== 'pickup') return showError('This link is invalid or has expired.')

    if (['picked_up', 'in_transit', 'delivered'].includes(delivery.status)) {
      return showAlreadyConfirmed('pickup')
    }
    if (delivery.status === 'damage_reported') {
      return showError('This delivery is on hold. Please call Signature Pianos.', 'Link closed')
    }
    currentDelivery = delivery
    renderPickupPage(delivery)
  } catch (err) {
    console.error('[pickup] load failed', err)
    showError('We could not load this pickup. Please try again or contact Signature Pianos.', 'Something went wrong')
  }
})()

function esc(s) {
  if (s == null) return ''
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

function renderPickupPage(delivery) {
  const piano    = delivery.piano    || {}
  const customer = delivery.customer || {}
  const pianoLabel = [piano.brand, piano.model, piano.year].filter(Boolean).join(' ') || 'Piano'
  const customerName = [customer.first_name, customer.last_name].filter(Boolean).join(' ')

  // The piano is collected from the showroom and taken to the customer.
  const deliverTo = delivery.delivery_address || ''

  document.getElementById('pageContent').innerHTML = `

    <div style="background:#F3F0E9;padding:18px 24px;position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(22, 34, 46, 0.12);">
      <div style="font-family:var(--font-script);font-size:30px;line-height:1;color:#16222E;">Signature Pianos</div>
      <div style="font-size:12px;color:#3A4855;margin-top:4px;letter-spacing:0.04em;">Piano pickup — photo confirmation</div>
    </div>

    <div style="padding:24px;max-width:480px;margin:0 auto;">

      <div style="background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;padding:16px;margin-bottom:24px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-bottom:8px;">Piano to collect</div>
        <div style="font-size:20px;font-family:var(--font-display);color:#16222E;font-style:italic;margin-bottom:4px;">${esc(pianoLabel)}</div>
        <div style="font-size:12px;color:#3A4855;">
          ${piano.serial_number ? 'Serial: ' + esc(piano.serial_number) : ''}
        </div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-top:14px;margin-bottom:4px;">Collect from</div>
        <div style="font-size:13px;color:#3A4855;line-height:1.6;">Signature Pianos Warehouse<br>63 Blackburn Road, Mount Waverley VIC 3149</div>
        ${deliverTo || customerName ? `
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-top:14px;margin-bottom:4px;">Deliver to</div>
          <div style="font-size:13px;color:#3A4855;line-height:1.6;">${esc([customerName, deliverTo].filter(Boolean).join(', '))}</div>
        ` : ''}
      </div>

      <div style="margin-bottom:24px;">
        <div style="font-size:14px;font-weight:500;color:#16222E;margin-bottom:12px;">Before you move this piano:</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${[
            'Inspect the piano carefully for any existing damage',
            'Photograph all 4 sides of the piano',
            'Photograph the keys and any existing marks or scratches',
            'Take at least 3 photos minimum',
            'Upload all photos using the button below',
          ].map((step, i) => `
            <div style="display:flex;gap:12px;align-items:flex-start;">
              <div style="background:#16222E;color:#FFFFFF;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;margin-top:1px;">${i + 1}</div>
              <div style="font-size:14px;color:#3A4855;line-height:1.5;padding-top:3px;">${esc(step)}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div style="background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.3);border-radius:4px;padding:14px;margin-bottom:24px;">
        <div style="font-size:13px;color:#e74c3c;font-weight:500;margin-bottom:4px;">Do not move the piano until photos are uploaded</div>
        <div style="font-size:12px;color:rgba(231,76,60,0.85);line-height:1.5;">These photos protect you and Signature Pianos if any damage is claimed during transit.</div>
      </div>

      <div style="margin-bottom:24px;">
        <div style="font-size:14px;font-weight:500;color:#16222E;margin-bottom:12px;">Upload photos</div>

        <div id="uploadArea" onclick="document.getElementById('photoInput').click()"
          style="border:2px dashed rgba(22, 34, 46, 0.3);border-radius:4px;padding:32px 20px;text-align:center;cursor:pointer;transition:border-color 0.2s ease;margin-bottom:12px;">
          <div style="font-size:36px;margin-bottom:8px;">📷</div>
          <div style="font-size:14px;color:#3A4855;">Tap to take photos or choose from camera roll</div>
          <div style="font-size:12px;color:#3A4855;margin-top:4px;">Minimum 3 photos required</div>
        </div>

        <input type="file" id="photoInput"
          accept="image/*" multiple capture="environment"
          style="display:none"
          onchange="handlePhotoSelect(event)">

        <div id="photoPreview" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;"></div>
        <div id="photoCount" style="font-size:12px;color:#3A4855;margin-top:8px;text-align:center;"></div>
      </div>

      <div style="margin-bottom:24px;">
        <label style="font-size:12px;color:#3A4855;text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:8px;">Notes (optional)</label>
        <textarea id="pickupNotes" rows="3"
          placeholder="Any existing damage, marks, or notes about the piano condition..."
          style="width:100%;padding:12px;background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;color:#16222E;font-size:14px;resize:vertical;box-sizing:border-box;font-family:var(--font-body);"></textarea>
      </div>

      <button id="submitBtn" onclick="submitPickupPhotos()" disabled
        style="width:100%;background:#444;color:#888;border:none;border-radius:4px;padding:18px;font-size:15px;font-weight:500;letter-spacing:0.05em;cursor:not-allowed;transition:all 0.2s ease;font-family:var(--font-body);">
        ADD AT LEAST 3 PHOTOS TO CONTINUE
      </button>

      <div id="submitError" style="display:none;margin-top:12px;padding:12px;background:rgba(192,57,43,0.1);border-radius:4px;font-size:13px;color:#e74c3c;text-align:center;"></div>

    </div>
  `
}

/* ---------- Photo selection ---------- */
function handlePhotoSelect(e) {
  const files = Array.from(e.target.files || [])
  // Reset so picking the same image twice still fires onchange.
  e.target.value = ''
  if (!files.length) return
  // Each photo takes its slot straight away (the preview fills in when the
  // file has been read), so the cap holds when many files are picked at once.
  files.forEach(file => {
    if (!file.type.startsWith('image/')) return
    if (selectedPhotos.length >= MAX_PHOTOS) return // hard cap
    const photo = { file, dataUrl: null, url: null }
    selectedPhotos.push(photo)
    const reader = new FileReader()
    reader.onload = (ev) => {
      photo.dataUrl = ev.target.result
      renderPhotoPreview()
    }
    reader.readAsDataURL(file)
  })
  renderPhotoPreview()
}

function renderPhotoPreview() {
  const preview = document.getElementById('photoPreview')
  const count   = document.getElementById('photoCount')
  const btn     = document.getElementById('submitBtn')

  preview.innerHTML = selectedPhotos.map((photo, i) => `
    <div style="position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:#E9E5DB;">
      ${photo.dataUrl ? `<img src="${photo.dataUrl}" style="width:100%;height:100%;object-fit:cover;">` : ''}
      <button onclick="removePhoto(${i})"
        style="position:absolute;top:4px;right:4px;background:rgba(22, 34, 46, 0.28);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">×</button>
    </div>
  `).join('')

  const n = selectedPhotos.length
  count.textContent = `${n} photo${n !== 1 ? 's' : ''} selected${n >= MAX_PHOTOS ? ' (maximum)' : ''}`
  count.style.color = n >= 3 ? '#1D9E75' : '#3A4855'

  if (n >= 3) {
    btn.disabled = false
    btn.style.background = '#16222E'
    btn.style.color = '#FFFFFF'
    btn.style.cursor = 'pointer'
    btn.textContent = `CONFIRM PICKUP — ${n} PHOTO${n !== 1 ? 'S' : ''}`
  } else {
    btn.disabled = true
    btn.style.background = '#444'
    btn.style.color = '#888'
    btn.style.cursor = 'not-allowed'
    btn.textContent = 'ADD AT LEAST 3 PHOTOS TO CONTINUE'
  }
}

function removePhoto(i) {
  selectedPhotos.splice(i, 1)
  renderPhotoPreview()
}

/* ---------- Upload + submit ---------- */
async function submitPickupPhotos() {
  if (selectedPhotos.length < 3) return
  const btn     = document.getElementById('submitBtn')
  const errorEl = document.getElementById('submitError')
  btn.disabled = true
  errorEl.style.display = 'none'

  try {
    const uploadedUrls = []
    const deliveryId = currentDelivery.delivery_id

    // Photos already uploaded on an earlier try keep their URL and are
    // not uploaded again.
    for (let i = 0; i < selectedPhotos.length; i++) {
      btn.textContent = `UPLOADING ${i + 1} OF ${selectedPhotos.length}…`
      try {
        uploadedUrls.push(await uploadPhoto(selectedPhotos[i], i, deliveryId, 'pickup'))
      } catch (upErr) {
        upErr.userMessage = `Photo ${i + 1} didn't upload (${upErr.message || 'network error'}). Check your connection and tap Try again; photos already uploaded won't be sent twice.`
        throw upErr
      }
    }

    btn.textContent = 'CONFIRMING…'
    let res
    try {
      res = await fetch('/api/driver-pickup-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token,
          photo_urls:  uploadedUrls,
          notes:       document.getElementById('pickupNotes').value.trim() || null,
        }),
      })
    } catch (netErr) {
      netErr.userMessage = 'Your photos are uploaded, but we couldn\'t reach Signature Pianos to confirm. Check your connection and tap Try again.'
      throw netErr
    }
    const result = await res.json().catch(() => ({}))
    if (!res.ok || !result.success) {
      console.error('[pickup] confirm API failed', result)
      const apiErr = new Error(result.error || `Confirm failed (${res.status})`)
      apiErr.userMessage = result.error || `Something went wrong confirming the pickup (error ${res.status}). Tap Try again, or call Signature Pianos.`
      throw apiErr
    }

    showPickupSuccess(uploadedUrls.length, result)
  } catch (err) {
    console.error('[pickup] submit failed', err)
    btn.disabled = false
    btn.textContent = 'TRY AGAIN'
    btn.style.background = '#c0392b'
    btn.style.color = '#fff'
    errorEl.style.display = 'block'
    errorEl.textContent = err.userMessage || 'Upload failed — please check your connection and try again.'
  }
}

/* Upload one photo (once) to delivery-photos/{deliveryId}/{leg}/ and return its public URL. */
async function uploadPhoto(photo, i, deliveryId, leg) {
  if (photo.url) return photo.url
  const types = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/heic': 'heic', 'image/heif': 'heif', 'image/gif': 'gif' }
  const type = types[photo.file.type] ? photo.file.type : 'image/jpeg'
  const filename = `${deliveryId}/${leg}/${Date.now()}-${i + 1}.${types[type]}`
  const { error: upErr } = await _supabase.storage
    .from('delivery-photos')
    .upload(filename, photo.file, { contentType: type, upsert: false })
  if (upErr) throw upErr
  const { data: urlData } = _supabase.storage
    .from('delivery-photos')
    .getPublicUrl(filename)
  photo.url = urlData.publicUrl
  return photo.url
}

function showPickupSuccess(count, result = {}) {
  const notified = result.customer_notified !== false
  const linkSent = result.delivery_link_sent !== false
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:72px;margin-bottom:24px;color:#1D9E75;">✓</div>
        <h2 style="font-family:var(--font-display);font-size:32px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 16px;">Pickup confirmed.</h2>
        <p style="font-size:14px;color:#3A4855;line-height:1.7;margin:0 0 24px;">
          ${count} photos uploaded successfully.
          ${notified ? 'The customer has been notified that their piano is on its way.' : 'Signature Pianos will let the customer know their piano is on its way.'}
        </p>
        <div style="background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;padding:16px;font-size:13px;color:#3A4855;text-align:left;">
          <div style="margin-bottom:6px;">✓ Photos saved to Signature Pianos</div>
          <div style="margin-bottom:6px;">${notified ? '✓ Customer notified' : '• Customer to be notified by Signature Pianos'}</div>
          <div style="margin-bottom:6px;">✓ Delivery status updated</div>
          <div>${linkSent ? '✓ Your delivery photo link has been emailed to you' : '• Signature Pianos will send your delivery photo link'}</div>
        </div>
      </div>
    </div>
  `
}

function showAlreadyConfirmed() {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:48px;margin-bottom:16px;color:#1D9E75;">✓</div>
        <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">Pickup already confirmed</h2>
        <p style="font-size:13px;color:#3A4855;line-height:1.7;">This has already been submitted. Contact Signature Pianos if you need help.</p>
      </div>
    </div>
  `
}

function showError(message, title = 'Link not found') {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:48px;margin-bottom:16px;color:#16222E;">✗</div>
        <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">${esc(title)}</h2>
        <p style="font-size:13px;color:#3A4855;line-height:1.7;">${esc(message)}</p>
      </div>
    </div>
  `
}
</script>

</body>
</html>
