<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — Signature Pianos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Italianno&amp;family=Jost:wght@300..500&amp;family=Noto+Serif+Display:wdth,wght@62.5,400..500&amp;display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F3F0E9;
    color: #16222E;
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .header-strip {
    background: #F3F0E9;
    padding: 20px 24px;
    border-bottom: 1px solid rgba(22, 34, 46, 0.14);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo { display: block; width: 150px; color: #16222E; }
  .logo img { display: block; width: 100%; height: auto; }
  .signout-btn {
    background: none;
    border: 1px solid rgba(22, 34, 46, 0.3);
    color: #3A4855;
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .signout-btn:hover { color: #16222E; border-color: rgba(22, 34, 46, 0.5); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 24px 80px; }
  .welcome {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 300;
    font-style: italic;
    margin-bottom: 8px;
  }
  .tagline { font-size: 13px; color: #3A4855; margin-bottom: 32px; }

  .section {
    background: #E9E5DB;
    border: 1px solid rgba(22, 34, 46, 0.15);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #16222E;
    margin-bottom: 16px;
  }
  .pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
  }
  .pill-amber { background: rgba(184,134,11,0.15); color: #b8860b; }
  .pill-blue  { background: rgba(36,113,163,0.15); color: #2471a3; }
  .pill-green { background: rgba(26,127,75,0.15);  color: #1a7f4b; }
  .pill-red   { background: rgba(192,57,43,0.15);  color: #c0392b; }

  .progress-steps {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin: 14px 0 4px;
  }
  .progress-step {
    text-align: center;
    font-size: 10px;
    color: #3A4855;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .progress-step .dot {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(22, 34, 46, 0.06);
    color: rgba(22, 34, 46, 0.3);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 6px;
    font-size: 12px;
    font-weight: 500;
  }
  .progress-step.is-done .dot { background: #16222E; color:#FFFFFF; }
  .progress-step.is-current .dot { background: rgba(22, 34, 46, 0.3); color: #16222E; box-shadow: 0 0 0 2px #16222E; }

  .btn-outline {
    display: inline-block;
    background: none;
    border: 1px solid rgba(22, 34, 46, 0.4);
    color: #16222E;
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 12px;
    text-decoration: none;
    font-family: var(--font-body);
    cursor: pointer;
  }
  .btn-outline:hover { background: rgba(22, 34, 46, 0.1); }
  .btn-gold {
    display: inline-block;
    background: #16222E;
    color:#FFFFFF;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 12px;
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font-body);
  }
</style>
<link rel="stylesheet" href="/css/signature-theme.css" />
<link rel="icon" href="/media/brand/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/media/brand/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/media/brand/apple-touch-icon.png" />
</head>
<body>

<div class="header-strip">
  <div>
    <a href="/" class="logo"><img src="/media/brand/logo-ink.svg" width="1542" height="592" alt="Signature Pianos"></a>
    <div style="font-size:10px;color:#3A4855;letter-spacing:0.15em;text-transform:uppercase;margin-top:6px;">My Account</div>
  </div>
  <button class="signout-btn" onclick="signOut()">
    <i class="ti ti-logout" style="font-size:13px;"></i> Sign out
  </button>
</div>

<div class="wrap" id="dashboardContent">
  <div style="padding:80px 24px;text-align:center;color:#3A4855;">Loading your account…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
/* ============================================================================
   Signature Pianos — customer portal dashboard
   ----------------------------------------------------------------------------
   Magic-link auth: redirected here from portal/index.html. On load we call
   claim_customer() (supabase/rpc_portal.sql), which links this sign-in to
   the customer record with the same verified email, then portal_summary(),
   which returns only what this page shows for that customer: orders (not
   voided) with the piano's brand / model / year, delivery progress,
   warranties and tuner bookings. The tables themselves are not readable by
   customers; the RPCs are the only way in.
   ============================================================================ */

function esc(s) {
  if (s == null) return ''
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}
// Dates show as dd/mm/yyyy in Melbourne time. Plain dates (2026-09-19) are
// calendar days already; timestamps are converted from UTC.
function fmtDateAU(d) {
  if (!d) return '—'
  const s = String(d)
  const plain = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s)
  if (plain) return `${plain[3]}/${plain[2]}/${plain[1]}`
  const dt = new Date(s)
  if (isNaN(dt.getTime())) return s
  return dt.toLocaleDateString('en-AU', { timeZone: 'Australia/Melbourne', day: '2-digit', month: '2-digit', year: 'numeric' })
}
// "14:30:00" -> "2:30 pm"; anything else ("Morning") is shown as entered
function fmtTime(t) {
  if (!t) return ''
  const m = /^(\d{1,2}):(\d{2})(?::\d{2})?$/.exec(String(t).trim())
  if (!m) return String(t)
  const h = Number(m[1])
  return `${h % 12 || 12}:${m[2]} ${h < 12 ? 'am' : 'pm'}`
}
function fmtCur(v) {
  return '$' + Math.abs(Number(v || 0)).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
}

async function signOut() {
  await _supabase.auth.signOut()
  window.location.replace('/portal')
}

;(async function loadDashboard() {
  // An expired or already-used magic link comes back with the error in the hash
  if (/error_code=|error=/.test(location.hash)) {
    window.location.replace('/portal?link=expired')
    return
  }
  const { data: { user } } = await _supabase.auth.getUser()
  if (!user) {
    // Clear any stale local session so the sign-in page doesn't bounce back here
    try { await _supabase.auth.signOut({ scope: 'local' }) } catch (e) {}
    window.location.replace('/portal')
    return
  }

  let summary = null
  try {
    // Link this sign-in to the customer record with the same verified email
    const { error: claimErr } = await _supabase.rpc('claim_customer')
    if (claimErr) throw claimErr
    const { data, error } = await _supabase.rpc('portal_summary')
    if (error) throw error
    summary = data
  } catch (err) {
    console.error('[portal] account load failed', err)
    return showLoadError()
  }
  if (!summary) return showNoAccountFound(user.email)

  renderDashboard(summary)
})()

function renderDashboard(summary) {
  const wrap = document.getElementById('dashboardContent')
  const orders = Array.isArray(summary.orders) ? summary.orders : []
  const tunerBookings = Array.isArray(summary.tuner_bookings) ? summary.tuner_bookings : []
  const name = esc(summary.first_name || 'friend')
  if (!orders.length) {
    wrap.innerHTML = `
      <h1 class="welcome">Welcome back, ${name}.</h1>
      <p class="tagline">No orders yet — once you make a purchase, you'll see your piano and delivery details here.</p>
    `
    return
  }

  wrap.innerHTML = `
    <h1 class="welcome">Welcome back, ${name}.</h1>
    <p class="tagline">Here's everything on your account.</p>

    ${renderMyPianos(orders)}
    ${renderDeliveryStatus(orders)}
    ${renderTuningStatus(orders, tunerBookings)}
    ${renderWarrantySection(orders)}
  `
}

// The piano on the order: its record when there is one, otherwise the first
// line on the invoice (orders store the piano as their first line item).
function pianoLabel(o) {
  const p = o.piano
  if (p && (p.brand || p.model)) return [p.brand, p.model, p.year].filter(Boolean).join(' ')
  return o.item || 'Your order'
}

// Every order_status, in words that match what has actually happened
function orderStatusPill(o) {
  const delivered = (o.deliveries || []).some(d => d.status === 'delivered')
  switch (o.status) {
    case 'cancelled':  return '<span class="pill pill-red">Cancelled</span>'
    case 'complete':   return '<span class="pill pill-green">Complete</span>'
    case 'delivered':  return '<span class="pill pill-green">Delivered</span>'
  }
  if (delivered) return '<span class="pill pill-green">Delivered</span>'
  switch (o.status) {
    case 'delivering': return '<span class="pill pill-blue">Delivery under way</span>'
    case 'paid':       return '<span class="pill pill-blue">Paid in full</span>'
    case 'confirmed':  return '<span class="pill pill-blue">Confirmed</span>'
    case 'pending':
      return o.payment_method === 'deposit_paid_online'
        ? '<span class="pill pill-amber">Reserved · deposit paid</span>'
        : '<span class="pill pill-amber">Awaiting confirmation</span>'
    default:           return `<span class="pill pill-blue">${esc(o.status || 'Received')}</span>`
  }
}

/* ---------- Section 1 — My pianos ---------- */
function renderMyPianos(orders) {
  return `
    <div class="section">
      <div class="section-title">My pianos</div>
      ${orders.map(o => {
        const label = pianoLabel(o)
        const statusPill = orderStatusPill(o)
        return `
          <div style="padding:14px 0;border-bottom:1px solid rgba(22, 34, 46, 0.1);">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
              <div>
                <div style="font-family:var(--font-display);font-size:20px;font-style:italic;color:#16222E;">${esc(label)}</div>
                <div style="font-size:12px;color:#3A4855;margin-top:2px;">
                  Invoice ${esc(o.invoice_number || '—')} · ${fmtDateAU(o.created_at)} · ${fmtCur(o.total)}
                </div>
              </div>
              <div>${statusPill}</div>
            </div>
            <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn-outline" onclick="alert('Invoice viewing from the portal is on the roadmap — for now please use the PDF in your purchase confirmation email or contact us.')">View invoice</button>
              ${o.warranties?.length ? `<button class="btn-outline" onclick="downloadWarranty('${esc(o.warranties[0].id)}', this)">Download warranty</button>` : ''}
            </div>
          </div>
        `
      }).join('')}
    </div>
  `
}

/* ---------- Section 2 — Delivery status (most recent order with a delivery) ---------- */
function renderDeliveryStatus(orders) {
  const first = orders.find(o => o.status !== 'cancelled' && o.deliveries?.length)
  const delivery = first?.deliveries?.[0]
  if (!delivery) return ''

  // Map delivery status to a 5-step progress.
  const steps = ['Order placed', 'Preferences', 'Confirmed', 'Picked up', 'Delivered']
  let stepIdx = 0
  if (delivery.preferences_submitted)          stepIdx = Math.max(stepIdx, 1)
  if (delivery.driver_accepted)                stepIdx = Math.max(stepIdx, 2)
  if (delivery.status === 'picked_up' || delivery.status === 'in_transit') stepIdx = Math.max(stepIdx, 3)
  if (delivery.status === 'delivered')         stepIdx = 4

  return `
    <div class="section">
      <div class="section-title">Delivery progress</div>
      <div class="progress-steps">
        ${steps.map((s, i) => `
          <div class="progress-step ${i < stepIdx ? 'is-done' : (i === stepIdx ? 'is-current' : '')}">
            <div class="dot">${i < stepIdx ? '✓' : i + 1}</div>
            ${esc(s)}
          </div>
        `).join('')}
      </div>
      ${delivery.scheduled_date && delivery.status !== 'delivered' ? `
        <div style="font-size:12px;color:#3A4855;margin-top:14px;">
          Scheduled for ${fmtDateAU(delivery.scheduled_date)}${delivery.scheduled_time_window ? ' · ' + esc(delivery.scheduled_time_window) : ''}.
        </div>
      ` : ''}
      ${delivery.status === 'delivered' && delivery.delivered_at ? `
        <div style="font-size:12px;color:#1a7f4b;margin-top:14px;">
          Delivered ${fmtDateAU(delivery.delivered_at)}.
        </div>
      ` : ''}
    </div>
  `
}

/* ---------- Section 3 — Tuning appointment ---------- */
function renderTuningStatus(orders, tunerBookings) {
  // Most recent booking that is still going ahead (newest first from the RPC)
  const tb = tunerBookings.find(t => t.status !== 'cancelled')
  // No booking yet: only promise a tuning for an acoustic piano on a live order
  const acoustic = orders.some(o => o.status !== 'cancelled' && (!o.piano || o.piano.type !== 'digital'))
  if (!tb && !acoustic) return ''
  let body
  const scheduled = (date, time) =>
    `Your tuning is scheduled for <strong style="color:#16222E;">${fmtDateAU(date)}</strong>${time ? ' · ' + esc(fmtTime(time)) : ''}.`
  if (tb?.completed) {
    body = tb.completed_at
      ? `Your first tuning was completed on ${fmtDateAU(tb.completed_at)}.`
      : 'Your first tuning has been completed.'
  } else if (tb?.confirmed_date) {
    body = scheduled(tb.confirmed_date, tb.confirmed_time)
  } else if (tb?.scheduled_date && tb.status === 'confirmed') {
    body = scheduled(tb.scheduled_date, tb.scheduled_time)
  } else if (tb?.contact_sent || tb?.status === 'contact_sent') {
    body = 'A tuner will be in contact with you shortly to arrange your first tuning appointment.'
  } else {
    body = 'Your complimentary first tuning will be arranged approximately 25 days after delivery.'
  }
  return `
    <div class="section">
      <div class="section-title">Tuning appointment</div>
      <p style="font-size:14px;color:#3A4855;line-height:1.7;">${body}</p>
    </div>
  `
}

/* ---------- Section 4 — Warranty ---------- */
function renderWarrantySection(orders) {
  const warranty = orders.flatMap(o => o.warranties || [])[0]
  if (!warranty) return ''
  return `
    <div class="section">
      <div class="section-title">Warranty</div>
      <div style="font-size:13px;color:#3A4855;line-height:1.9;">
        Certificate: <strong style="color:#16222E;font-family:ui-monospace,monospace;">${esc(warranty.warranty_number)}</strong><br>
        Start: ${fmtDateAU(warranty.start_date)}<br>
        Expires: <strong style="color:#16222E;">${fmtDateAU(warranty.expiry_date)}</strong>
      </div>
      <p style="font-size:12px;color:#3A4855;margin-top:12px;line-height:1.6;">
        We also emailed your certificate on delivery day. You can download a fresh copy here at any time.
      </p>
      <div style="margin-top:12px;">
        <button class="btn-outline" onclick="downloadWarranty('${esc(warranty.id)}', this)">Download certificate (PDF)</button>
      </div>
    </div>
  `
}

/* The certificate PDF, drawn by /api/warranty-certificate for the signed-in customer. */
async function downloadWarranty(id, btn) {
  const label = btn ? btn.textContent : ''
  if (btn) { btn.disabled = true; btn.textContent = 'Preparing…' }
  try {
    const { data: { session } } = await _supabase.auth.getSession()
    if (!session) { window.location.replace('/portal'); return }
    const res = await fetch('/api/warranty-certificate?id=' + encodeURIComponent(id), {
      headers: { Authorization: 'Bearer ' + session.access_token }
    })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    const name = (/filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '') || [])[1] || 'Signature-Pianos-Warranty.pdf'
    const url = URL.createObjectURL(await res.blob())
    const a = document.createElement('a')
    a.href = url
    a.download = name
    document.body.appendChild(a)
    a.click()
    a.remove()
    setTimeout(() => URL.revokeObjectURL(url), 10000)
  } catch (err) {
    console.error('[portal] warranty download failed', err)
    alert('Sorry, we couldn’t prepare your certificate just now. Please try again, or call us on 0479 128 955.')
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label }
  }
}

function showNoAccountFound(email) {
  document.getElementById('dashboardContent').innerHTML = `
    <h1 class="welcome">No account found</h1>
    <p class="tagline">
      We couldn't find a customer record for <strong style="color:#16222E;">${esc(email)}</strong>.
    </p>
    <p style="font-size:13px;color:#3A4855;line-height:1.7;max-width:480px;">
      If you've purchased from us before, the email you logged in with may not match the one we have on file. Please <a href="mailto:info@signaturepianos.com.au" style="color:#16222E;">contact us</a> and we'll sort it out.
    </p>
    <button class="signout-btn" style="margin-top:24px;" onclick="signOut()">Sign out</button>
  `
}

function showLoadError() {
  document.getElementById('dashboardContent').innerHTML = `
    <h1 class="welcome">We couldn't load your account</h1>
    <p class="tagline">Something went wrong on our side.</p>
    <p style="font-size:13px;color:#3A4855;line-height:1.7;max-width:480px;">
      Please refresh the page in a minute. If it keeps happening, call us on <a href="tel:+61479128955" style="color:#16222E;">0479 128 955</a> or email <a href="mailto:info@signaturepianos.com.au" style="color:#16222E;">info@signaturepianos.com.au</a>.
    </p>
    <button class="signout-btn" style="margin-top:24px;" onclick="signOut()">Sign out</button>
  `
}
</script>

</body>
</html>
