<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delivery preferences — Signature Pianos</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Italianno&amp;family=Jost:wght@300..500&amp;family=Noto+Serif+Display:wdth,wght@62.5,400..500&amp;display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

<style>
  :root {
    --bg-1: #F3F0E9; --bg-2: #E9E5DB; --bg-3: #DCE6ED;
    --gold: #16222E; --gold-light: #3A4855;
    --text-1: #16222E; --text-2: #3A4855; --text-3: #3A4855;
    --border: rgba(22, 34, 46, 0.15);
    --border-strong: rgba(22, 34, 46, 0.4);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg-1); color: var(--text-1);
    font-family: var(--font-body); font-weight: 300; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  .logo {
    font-family: var(--font-display);
    font-size: 24px; font-weight: 300; letter-spacing: 0.01em;
    text-align: center; margin: 0 0 8px;
  }
  .logo em { color: var(--gold); font-style: italic; font-weight: 400; }
  .tagline {
    text-align: center; font-size: 10px;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--text-3); margin: 0 0 48px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 300; font-size: 36px; line-height: 1.2;
    margin: 0 0 12px;
  }
  .intro {
    color: var(--text-2); font-size: 14px; line-height: 1.7; margin: 0 0 32px;
  }
  .order-meta {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 18px;
    margin-bottom: 32px;
    font-size: 13px;
    color: var(--text-2);
  }
  .order-meta strong { color: var(--text-1); }

  .pref-block {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .pref-block-title {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin: 0 0 12px;
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 540px) { .field-row { grid-template-columns: 1fr; } }
  .field-row label { display: block; }

  label .lbl {
    display: block;
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--bg-1);
    color: var(--text-1);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 300;
    transition: border-color 0.2s ease;
  }
  textarea { min-height: 90px; line-height: 1.5; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--border-strong);
  }

  .btn {
    width: 100%;
    background: var(--gold);
    color: var(--bg-1);
    border: 0;
    padding: 16px 20px;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    margin-top: 16px;
    transition: background 0.2s ease;
  }
  .btn:hover { background: var(--gold-light); }
  .btn:disabled { opacity: 0.5; cursor: progress; }

  .banner {
    padding: 14px 18px;
    border-radius: 4px;
    font-size: 13px;
    margin-bottom: 24px;
    display: none;
  }
  .banner.is-shown { display: block; }
  /* Dark text on the light page (the old pale pink/green was unreadable on ivory). */
  .banner--error {
    background: rgba(192, 57, 43, 0.08);
    border: 1px solid rgba(192, 57, 43, 0.4);
    color: #8E2A1F;
  }
  .banner--success {
    background: rgba(26, 127, 75, 0.08);
    border: 1px solid rgba(26, 127, 75, 0.4);
    color: #1A5E3A;
  }

  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-2);
  }
  .empty-state i { font-size: 40px; color: var(--gold); display: block; margin-bottom: 14px; }

  .submitted-summary {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 24px;
    margin-top: 24px;
  }
  .submitted-summary .row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 13px;
  }
  .submitted-summary .row:last-child { border-bottom: 0; }
</style>
<link rel="stylesheet" href="/css/signature-theme.css" />
<link rel="icon" href="/media/brand/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/media/brand/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/media/brand/apple-touch-icon.png" />
</head>
<body>

<div class="wrap">
  <p class="logo">Signature <em>Pianos</em></p>
  <p class="tagline">Melbourne</p>

  <div id="pageBody">
    <div class="empty-state">
      <i class="ti ti-loader"></i>
      <p>Loading your booking…</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
/* The page reads and writes through two token-scoped RPCs
   (supabase/rpc_delivery_links.sql): get_delivery_for_customer returns only
   this booking's details, submit_delivery_preferences writes only the
   preference columns, once. The deliveries table is never touched directly. */
let delivery = null
let orderSummary = null
let token = null

;(async function init() {
  token = new URLSearchParams(window.location.search).get('token')
  if (!token) {
    showError("This link is missing its access token. Please use the link from your confirmation email.")
    return
  }
  await loadDelivery(token)
})()

async function loadDelivery(token) {
  try {
    const { data: dlv, error } = await _supabase
      .rpc('get_delivery_for_customer', { p_token: token })
    if (error) throw error
    if (!dlv) {
      showError("We couldn't find this delivery. The link may be expired or incorrect.")
      return
    }
    delivery = dlv
    orderSummary = {
      order_number: dlv.order_number,
      total:        dlv.order_total,
      piano:        dlv.piano || {},
      address:      dlv.address || '',
    }

    if (delivery.customer_preferences_submitted) {
      renderSubmitted()
    } else {
      renderForm()
    }
  } catch (err) {
    console.error('[delivery-prefs] load failed', err)
    showError("We hit a problem loading your booking. Please try again later or reply to your confirmation email.")
  }
}

function fmtAUD(n) {
  return '$' + Number(n || 0).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
}
function esc(value) {
  if (value === null || value === undefined) return ''
  return String(value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

function orderMetaHTML() {
  if (!orderSummary) return ''
  const piano = orderSummary.piano || {}
  // Once submitted, show the address the customer confirmed.
  const addr = delivery?.customer_address_confirmed || orderSummary.address
  return `
    <div class="order-meta">
      <div><strong>${esc(piano.brand || 'Piano')} ${esc(piano.model || '')} ${esc(piano.year || '')}</strong></div>
      <div>Order ${esc(orderSummary.order_number || '—')} · ${fmtAUD(orderSummary.total)}</div>
      ${addr ? `<div style="margin-top:6px;">Delivery to: ${esc(addr)}</div>` : ''}
    </div>
  `
}

function renderForm() {
  const today = new Date()
  // Earliest delivery is 7 days out (lets the warehouse prep), latest 8 weeks.
  const minDate = new Date(today); minDate.setDate(today.getDate() + 7)
  const maxDate = new Date(today); maxDate.setDate(today.getDate() + 56)
  // Local calendar date (toISOString would give the UTC date: yesterday
  // for a Melbourne morning).
  const pad = (n) => String(n).padStart(2, '0')
  const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
  const minStr = fmt(minDate), maxStr = fmt(maxDate)

  const windows = ['Morning (9am–12pm)', 'Afternoon (12pm–4pm)', 'Late afternoon (4pm–6pm)']

  const prefBlock = (n) => `
    <div class="pref-block">
      <p class="pref-block-title">Preference ${n}${n === 1 ? ' · most preferred' : ''}</p>
      <div class="field-row">
        <label>
          <span class="lbl">Date</span>
          <input type="date" id="pref-date-${n}" min="${minStr}" max="${maxStr}" required>
        </label>
        <label>
          <span class="lbl">Time window</span>
          <select id="pref-time-${n}" required>
            <option value="">Select a window…</option>
            ${windows.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('')}
          </select>
        </label>
      </div>
    </div>
  `

  document.getElementById('pageBody').innerHTML = `
    <h1>Pick your delivery window</h1>
    <p class="intro">
      Thanks for your purchase. To get your piano to you smoothly, please share your three preferred
      delivery windows in order of preference. We'll confirm one of them by email or phone within
      48 hours.
    </p>

    ${orderMetaHTML()}

    <div class="banner banner--error" id="formError"></div>

    <form id="prefsForm" novalidate>
      ${prefBlock(1)}
      ${prefBlock(2)}
      ${prefBlock(3)}

      <div class="pref-block">
        <p class="pref-block-title">Delivery details</p>
        <label style="display:block;margin-bottom:14px;">
          <span class="lbl">Confirm delivery address</span>
          <input type="text" id="pref-address" placeholder="Where should we deliver?" maxlength="300" value="${esc(orderSummary?.address || '')}" required>
        </label>
        <label style="display:block;">
          <span class="lbl">Special instructions (stairs, parking, access)</span>
          <textarea id="pref-instructions" maxlength="2000" placeholder="Anything our team should know before arriving"></textarea>
        </label>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        Submit my preferences
      </button>
    </form>
  `

  document.getElementById('prefsForm').addEventListener('submit', onSubmit)
}

function renderSubmitted() {
  const fmtPref = (p) => {
    if (!p) return '—'
    try {
      const o = typeof p === 'string' ? JSON.parse(p) : p
      return `${o.date || '—'} · ${o.time || '—'}`
    } catch { return '—' }
  }
  document.getElementById('pageBody').innerHTML = `
    <h1>Preferences received</h1>
    <p class="intro">
      Thanks — we've got your three preferred windows and will be in touch within 48 hours
      to confirm the booking. If anything changes, just reply to your confirmation email.
    </p>

    ${orderMetaHTML()}

    <div class="submitted-summary">
      <div class="row"><span>Preference 1</span><span>${esc(fmtPref(delivery.customer_preference_1))}</span></div>
      <div class="row"><span>Preference 2</span><span>${esc(fmtPref(delivery.customer_preference_2))}</span></div>
      <div class="row"><span>Preference 3</span><span>${esc(fmtPref(delivery.customer_preference_3))}</span></div>
      ${delivery.customer_address_confirmed ? `<div class="row"><span>Address</span><span style="text-align:right;">${esc(delivery.customer_address_confirmed)}</span></div>` : ''}
      ${delivery.customer_special_instructions ? `<div class="row"><span>Notes</span><span style="text-align:right;">${esc(delivery.customer_special_instructions)}</span></div>` : ''}
    </div>
  `
}

async function onSubmit(e) {
  e.preventDefault()
  const errEl = document.getElementById('formError')
  errEl.classList.remove('is-shown')

  const prefs = []
  for (let i = 1; i <= 3; i++) {
    const date = document.getElementById(`pref-date-${i}`).value
    const time = document.getElementById(`pref-time-${i}`).value
    if (!date || !time) {
      errEl.textContent = `Preference ${i} — please pick both a date and a time window.`
      errEl.classList.add('is-shown')
      return
    }
    prefs.push({ date, time })
  }
  const address = document.getElementById('pref-address').value.trim()
  if (!address) {
    errEl.textContent = 'Please confirm your delivery address.'
    errEl.classList.add('is-shown')
    return
  }

  const instructions = document.getElementById('pref-instructions').value.trim()
  if (address.length > 300 || instructions.length > 2000) {
    errEl.textContent = 'Please shorten the address (300 characters) or instructions (2000 characters).'
    errEl.classList.add('is-shown')
    return
  }

  const btn = document.getElementById('submitBtn')
  btn.disabled = true
  btn.textContent = 'Submitting…'

  try {
    // Writes only the preference columns, once (see submit_delivery_preferences).
    const { data: result, error } = await _supabase.rpc('submit_delivery_preferences', {
      p_token:        token,
      p_pref1:        prefs[0],
      p_pref2:        prefs[1],
      p_pref3:        prefs[2],
      p_address:      address,
      p_instructions: instructions || null,
    })
    if (error) throw error
    if (!result || !result.ok) {
      const code = result && result.error
      if (code === 'already_submitted') {
        // Submitted already (another tab, or a double tap): show what was saved.
        await loadDelivery(token)
        return
      }
      const messages = {
        not_found:            "We couldn't find this delivery. The link may be expired or incorrect.",
        invalid_date:         'One of your dates is in the past or too far ahead. Please choose dates in the next few weeks.',
        invalid_preference:   'Please pick a date and a time window for each preference.',
        invalid_address:      'Please confirm your delivery address.',
        invalid_instructions: 'Please shorten your special instructions.',
      }
      const shown = new Error(messages[code] || "We couldn't save your preferences.")
      shown.userMessage = shown.message
      throw shown
    }

    // Fire-and-forget notification to the business inbox. Only the token
    // is sent: /api/send-email looks the delivery, order, customer, piano
    // and the saved preferences up server-side, so nothing in the email
    // comes from the browser.
    fetch('/api/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type:  'delivery_preferences_submitted',
        token,
      }),
    }).catch(() => { /* non-blocking */ })

    delivery.customer_preference_1 = prefs[0]
    delivery.customer_preference_2 = prefs[1]
    delivery.customer_preference_3 = prefs[2]
    delivery.customer_address_confirmed = address
    delivery.customer_special_instructions = instructions
    delivery.customer_preferences_submitted = new Date().toISOString()
    renderSubmitted()
  } catch (err) {
    console.error('[delivery-prefs] submit failed', err)
    errEl.textContent = err.userMessage || "We couldn't save your preferences. Please try again, or reply to your confirmation email."
    errEl.classList.add('is-shown')
    btn.disabled = false
    btn.textContent = 'Submit my preferences'
  }
}

function showError(msg) {
  document.getElementById('pageBody').innerHTML = `
    <h1>Hmm, something's not right</h1>
    <p class="intro">${esc(msg)}</p>
  `
}
</script>

</body>
</html>
