<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Log tuning date — Signature Pianos</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Italianno&amp;family=Jost:wght@300..500&amp;family=Noto+Serif+Display:wdth,wght@62.5,400..500&amp;display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F3F0E9;
      color: #16222E;
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<link rel="stylesheet" href="/css/signature-theme.css" />
<link rel="icon" href="/media/brand/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/media/brand/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/media/brand/apple-touch-icon.png" />
</head>
<body>

<div id="pageContent">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div style="text-align:center;">
      <div style="font-size:20px;color:#16222E;font-style:italic;margin-bottom:16px;">Signature Pianos</div>
      <div style="font-size:13px;color:#3A4855;">Loading…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script>
/* ============================================================================
   Signature Pianos — tuner log-date page (public, token based)
   ----------------------------------------------------------------------------
   New Session-12 flow. Tuner has already contacted the customer offline
   and agreed a date + time. They open this page on their phone, enter
   the agreed values, submit. The API writes confirmed_date / _time and
   fires the confirmation emails to customer + tuner + Eric.

   The booking is read through the get_tuner_booking_by_token RPC
   (supabase/rpc_tuner_links.sql): one booking, exact token match, only the
   fields shown here — booking.customer / booking.piano. The page never
   reads tables with the anon key. One use per link: once logged, changes
   go through Signature Pianos.
   ============================================================================ */

const params = new URLSearchParams(window.location.search)
// Token comes from /tuner/log-date/{token} via vercel.json rewrite which
// preserves the segment as ?token=. Fall back to last path segment if
// the rewrite is ever bypassed.
const token = params.get('token') || window.location.pathname.split('/').pop()
if (!token || token === 'log-date') { window.location.replace('/index.html') }

let currentBooking = null

;(async function loadLogDatePage() {
  try {
    const { data: booking, error } = await _supabase
      .rpc('get_tuner_booking_by_token', { p_token: token })

    if (error) throw error
    // An accept/propose link opened here (or any unknown token) is not valid.
    if (!booking || booking.kind !== 'log_date') return showError('This link is invalid or has expired.')

    if (booking.completed || booking.status === 'completed') {
      return showStatus('Already complete', 'This tuning has already been marked complete. No further action needed.')
    }
    if (booking.status === 'cancelled') {
      return showStatus('Booking cancelled', 'This tuning booking has been cancelled. No action needed.')
    }
    if (booking.date_logged) return showAlreadyLogged(booking)
    currentBooking = booking
    renderLogDatePage(booking)
  } catch (err) {
    console.error('[log-date] load failed', err)
    showError('We could not load this booking. Please try again or contact Signature Pianos.')
  }
})()

function esc(s) {
  if (s == null) return ''
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}
function fmtDateLong(d) {
  if (!d) return '—'
  try {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-AU', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
    })
  } catch { return d }
}

function renderLogDatePage(booking) {
  const customer = booking.customer || {}
  const piano    = booking.piano    || {}
  const pianoLabel = `${piano.brand || 'Yamaha'} ${piano.model || ''} ${piano.year || ''}`.trim()
  const fullAddress = [customer.address_line1, customer.address_line2, customer.suburb, customer.state, customer.postcode].filter(Boolean).join(', ')

  // Earliest date = today, in the tuner's own time zone (toISOString is UTC,
  // which in Melbourne mornings is still yesterday). The API accepts today.
  const now = new Date()
  const minDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`

  document.getElementById('pageContent').innerHTML = `

    <div style="background:#FFFFFF;padding:20px 24px;border-bottom:1px solid rgba(22, 34, 46, 0.12);">
      <div style="font-size:16px;color:#16222E;font-style:italic;">Signature Pianos</div>
      <div style="font-size:12px;color:#3A4855;margin-top:2px;">Log agreed tuning date</div>
    </div>

    <div style="padding:24px;max-width:480px;margin:0 auto;">

      <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 8px;">Log the agreed date</h2>
      <p style="font-size:14px;color:#3A4855;margin:0 0 24px;line-height:1.6;">
        Enter the date and time you agreed with the customer. Both the customer and Signature Pianos will be notified automatically.
      </p>

      <div style="background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;padding:16px;margin-bottom:24px;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#3A4855;margin-bottom:10px;">Job details</div>
        <table style="width:100%;font-size:13px;border-collapse:collapse;">
          <tr><td style="padding:7px 0;color:#3A4855;border-bottom:1px solid rgba(22, 34, 46, 0.06);width:35%;">Customer</td><td style="padding:7px 0;font-weight:500;border-bottom:1px solid rgba(22, 34, 46, 0.06);color:#16222E;">${esc((customer.first_name || '') + ' ' + (customer.last_name || ''))}</td></tr>
          <tr><td style="padding:7px 0;color:#3A4855;border-bottom:1px solid rgba(22, 34, 46, 0.06);">Phone</td><td style="padding:7px 0;border-bottom:1px solid rgba(22, 34, 46, 0.06);"><a href="tel:${esc(customer.phone || '')}" style="color:#16222E;">${esc(customer.phone || '—')}</a></td></tr>
          <tr><td style="padding:7px 0;color:#3A4855;border-bottom:1px solid rgba(22, 34, 46, 0.06);">Address</td><td style="padding:7px 0;font-size:12px;color:#3A4855;border-bottom:1px solid rgba(22, 34, 46, 0.06);">${esc(fullAddress || '—')}</td></tr>
          <tr><td style="padding:7px 0;color:#3A4855;">Piano</td><td style="padding:7px 0;color:#16222E;">${esc(pianoLabel)}</td></tr>
        </table>
      </div>

      <div style="margin-bottom:20px;">
        <label style="font-size:12px;color:#3A4855;text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:8px;">Agreed date *</label>
        <input type="date" id="agreedDate" min="${minDate}"
          style="width:100%;padding:14px;background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;color:#16222E;font-size:16px;box-sizing:border-box;">
      </div>

      <div style="margin-bottom:20px;">
        <label style="font-size:12px;color:#3A4855;text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:8px;">Agreed time *</label>
        <select id="agreedTime"
          style="width:100%;padding:14px;background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;color:#16222E;font-size:16px;box-sizing:border-box;">
          <option value="">Select time window...</option>
          <option>Morning (9am–12pm)</option>
          <option>Afternoon (12pm–4pm)</option>
          <option>Late afternoon (4pm–6pm)</option>
          <option>Flexible — I confirmed exact time with customer</option>
        </select>
      </div>

      <div style="margin-bottom:28px;">
        <label style="font-size:12px;color:#3A4855;text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:8px;">Notes (optional)</label>
        <textarea id="tunerNotes" rows="3"
          placeholder="Any notes about the job, access, or the piano..."
          style="width:100%;padding:12px;background:#E9E5DB;border:1px solid rgba(22, 34, 46, 0.2);border-radius:4px;color:#16222E;font-size:14px;resize:vertical;box-sizing:border-box;font-family:var(--font-body);"></textarea>
      </div>

      <button id="submitBtn" onclick="submitLogDate()"
        style="width:100%;background:#16222E;color:#FFFFFF;border:none;border-radius:4px;padding:18px;font-size:15px;font-weight:500;letter-spacing:0.05em;cursor:pointer;font-family:var(--font-body);">
        CONFIRM DATE &amp; NOTIFY CUSTOMER
      </button>

      <div id="submitError" style="display:none;margin-top:12px;padding:12px;background:rgba(192,57,43,0.1);border-radius:4px;font-size:13px;color:#e74c3c;text-align:center;"></div>

    </div>
  `
}

async function submitLogDate() {
  const agreedDate = document.getElementById('agreedDate').value
  const agreedTime = document.getElementById('agreedTime').value
  const notes      = document.getElementById('tunerNotes').value.trim()
  const err        = document.getElementById('submitError')
  const btn        = document.getElementById('submitBtn')

  if (!agreedDate) { err.style.display = 'block'; err.textContent = 'Please enter the agreed date.'; return }
  if (!agreedTime) { err.style.display = 'block'; err.textContent = 'Please select a time window.'; return }

  btn.textContent = 'SUBMITTING…'
  btn.disabled = true
  err.style.display = 'none'

  try {
    const res = await fetch('/api/tuner-log-date', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token,
        booking_id:  currentBooking.id,
        agreed_date: agreedDate,
        agreed_time: agreedTime,
        notes:       notes || null,
      }),
    })
    const result = await res.json().catch(() => ({}))
    if (res.ok && result.success) {
      showSuccess(agreedDate, agreedTime)
    } else {
      // A 4xx carries a message meant for the tuner ("Already logged",
      // "Please choose a date from today onwards").
      const e = new Error(result.error || 'Request failed')
      if (res.status >= 400 && res.status < 500 && result.error) e.userMessage = result.error
      throw e
    }
  } catch (e) {
    console.error('[log-date] submit failed', e)
    btn.disabled = false
    btn.textContent = 'CONFIRM DATE & NOTIFY CUSTOMER'
    err.style.display = 'block'
    err.textContent = (e && e.userMessage) || 'Something went wrong — please try again.'
  }
}

function showSuccess(date, time) {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:64px;margin-bottom:20px;color:#1D9E75;">✓</div>
        <h2 style="font-family:var(--font-display);font-size:30px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">Date logged.</h2>
        <p style="font-size:14px;color:#3A4855;line-height:1.7;margin:0 0 16px;">
          <strong style="color:#16222E;">${esc(fmtDateLong(date))} · ${esc(time)}</strong>
        </p>
        <p style="font-size:13px;color:#3A4855;line-height:1.6;">
          The customer and Signature Pianos have been notified. You will receive a reminder the day before.
        </p>
      </div>
    </div>
  `
}

function showAlreadyLogged(booking) {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:48px;margin-bottom:16px;color:#1D9E75;">✓</div>
        <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">Date already logged</h2>
        <p style="font-size:13px;color:#3A4855;line-height:1.7;">
          ${booking.confirmed_date ? `Confirmed for ${esc(fmtDateLong(booking.confirmed_date))}.` : 'This booking already has a confirmed date.'}
          Contact Signature Pianos if you need to make changes.
        </p>
      </div>
    </div>
  `
}

function showStatus(title, message) {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">${esc(title)}</h2>
        <p style="font-size:13px;color:#3A4855;line-height:1.7;">${esc(message)}</p>
      </div>
    </div>
  `
}

function showError(message) {
  document.getElementById('pageContent').innerHTML = `
    <div style="min-height:100vh;background:#F3F0E9;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:48px;margin-bottom:16px;color:#16222E;">✗</div>
        <h2 style="font-family:var(--font-display);font-size:28px;font-weight:300;color:#16222E;font-style:italic;margin:0 0 12px;">Link not found</h2>
        <p style="font-size:13px;color:#3A4855;line-height:1.7;">${esc(message)}</p>
      </div>
    </div>
  `
}
</script>

</body>
</html>
